# fly.toml — App de Postgres para FinCore. NO se expone a internet; sólo a la
# red privada 6PN de Fly. El backend la alcanza por `fincore-db.internal`.
#
# Esta opción (postgres como app Fly con volume) está documentada como "unmanaged
# Postgres" — más simple y barato que el managed Postgres oficial de Fly. La VM
# corre `postgres:17-alpine` con su volume montado en /var/lib/postgresql/data.
#
# Para `fly launch` con este archivo:
#   cd db && fly launch --copy-config --no-deploy --name fincore-db --region qro

app = "fincore-db"
primary_region = "qro"

[build]
  image = "postgres:17-alpine"

[env]
  POSTGRES_DB = "fincore"
  PGDATA = "/var/lib/postgresql/data/pgdata"

# Volumen persistente. Si reiniciás la VM, los datos siguen. Crear con:
#   fly volumes create fincore_pgdata --region qro --size 1
[[mounts]]
  source = "fincore_pgdata"
  destination = "/var/lib/postgresql/data"

# Servicio TCP interno en :5432. flycast resuelve `fincore-db.internal` a
# esta VM dentro de la red privada de la org. NO hay puerto público.
[[services]]
  internal_port = 5432
  protocol = "tcp"

  [[services.ports]]
    port = 5432

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
