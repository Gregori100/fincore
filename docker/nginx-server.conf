# Fragmento de site config para el container serversideup/php:8.4-fpm-nginx-alpine.
#
# Reemplaza al `http.conf.template` por defecto (que asume Laravel sirviendo TODO
# desde /index.php). En FinCore servimos SPA Vue + API Laravel desde el mismo
# origen, así que el ruteo es:
#
#   - /api/*       → PHP-FPM (Laravel)
#   - /up          → PHP-FPM (healthcheck de Laravel)
#   - .php         → PHP-FPM (con safe-guards)
#   - cualquier otra ruta → SPA Vue (con fallback a /index.html para history mode)
#
# Como SPA y API comparten origin, Sanctum + bearer tokens funcionan sin CORS y
# el `baseURL: '/api'` de axios resuelve correcto.

listen 8080 default_server;
listen [::]:8080 default_server;

root /var/www/html/public;
index index.html index.htm index.php;
server_name _;
charset utf-8;
absolute_redirect off;

# Healthcheck interno de serversideup — no tocar.
location /healthcheck {
    access_log off;
    fastcgi_read_timeout 5s;
    include        fastcgi_params;
    fastcgi_param  SCRIPT_NAME     /healthcheck;
    fastcgi_param  SCRIPT_FILENAME /healthcheck;
    fastcgi_pass   127.0.0.1:9000;
}

# /api/* y /up entran a Laravel.
location ~ ^/(api|up)(/|$) {
    try_files $uri $uri/ /index.php?$query_string;
}

# Bloqueo PHP arbitrario en /storage (mitigación Livewire GHSA-29cq-5w36-x7w3).
location ~* ^/storage/.*\.php$ {
    deny all;
}

# Cualquier .php se evalúa por PHP-FPM (necesario para /api → /index.php).
location ~ \.php$ {
    fastcgi_pass   127.0.0.1:9000;
    fastcgi_index  index.php;
    fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
    include        fastcgi_params;
    fastcgi_buffers 8 8k;
    fastcgi_buffer_size 8k;
    fastcgi_read_timeout 99;
}

# Cualquier otra ruta: archivo estático del SPA o fallback al index.html para que
# el router de Vue tome el control (modo history del SPA).
location / {
    try_files $uri $uri/ /index.html;
}

# Includes habituales de serversideup (performance, remoteip, security).
include /etc/nginx/server-opts.d/*.conf;
