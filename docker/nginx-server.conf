# FinCore: routing dentro de la imagen serversideup/php:8.4-fpm-nginx-alpine.
#
# Servimos dos cosas desde el mismo origen:
#   - /api/*  y /up  → Laravel (PHP-FPM). El bloque PHP por defecto ya está
#     definido en la config base; basta con redirigir a /index.php.
#   - cualquier otra ruta → SPA Vue (index.html con fallback de history mode).
#
# Como SPA y API comparten origin, Sanctum + cookies/bearer tokens funcionan sin
# CORS y el `baseURL: '/api'` de axios resuelve correctamente.

# /api/* y /up entran a Laravel.
location ~ ^/(api|up)(/|$) {
    try_files $uri $uri/ /index.php?$query_string;
}

# Cualquier otra ruta: archivo estático del build (assets, manifest, etc.) o
# fallback al index.html para que el router de Vue tome el control.
location / {
    try_files $uri $uri/ /index.html;
}
