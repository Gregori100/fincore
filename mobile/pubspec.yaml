# 0.15.2+79 — hint informativo en el chip "Sin categoría" del sheet de
# filtros: banner sutil con Icons.info_outline que aparece cuando el
# usuario combina el token con kinds puramente income o subset de
# gastos. Anticipa el comportamiento ampliado del DAO (RN-P01/P02).
# Sin cambios de datos ni de rutas. +4 widget tests.
# 0.15.3+80 — 2 mejoras UX detectadas usando la app real:
# (a) la row de movimientos (Dashboard + /entries) muestra la cuenta
#     relevante en el subtexto: destino en income, origen en gasto,
#     "origen → destino" en transfer/pago de tarjeta. Helper
#     `entryAccountLabel` en widgets/. +7 unit + 1 widget test.
# (b) el form de movimiento preserva el focus del monto/descripción
#     tras pausa (paused/inactive) y resume: al volver de otra app
#     (banco, calculadora) el mismo field vuelve a tener focus y el
#     teclado reaparece. WidgetsBindingObserver + 2 FocusNode. +1
#     widget test.
# 0.15.4+81 — refactor de la row de movimiento a 3 líneas +
# `SystemChannels.textInput.invokeMethod('TextInput.show')` para que
# el teclado reaparezca al volver de otra app (fix real del focus).
# Nuevo widget `MovementRow` reemplaza `_EntryTile` y `_Row` (dashboard
# + entries list). Layout: (1) descripción+monto; (2) cuenta·fecha·kind;
# (3) badge de categoría en línea propia. Sin duplicación de helpers.
# 0.16.0+82 — sprint flutter-reports-movements-calendar-v1: 9no tab
# "Calendario" en /reports con `table_calendar 3.1.2` (pinned). Muestra
# el mes en foco con hasta 3 marcadores por día según los tipos de
# movimiento presentes (verde ingreso, rojo gasto, azul movimiento
# interno). Tap en un día abre /entries con filter custom `from=to=día`.
# Nuevo método `ReportsService.movementsByDay` + factory
# `EntriesFilters.forDay`. Sin schema bump. +18 tests.
# 0.16.1+83 — sprint flutter-reports-spending-heatmap-v1: 10mo tab
# "Heatmap" en /reports con vista año completo estilo GitHub. Grilla
# 7 filas x ~53 columnas con intensidad de color por día según gasto
# (solo expense + credit_expense) en 5 niveles calculados por cuartiles
# relativos al año. Selector de año con chevrons. Tap en día abre
# /entries con filter custom + kinds=['expense','credit_expense'].
# CustomPaint sin dep externa. +20 tests. Sin schema bump.
# 0.16.2+84 — housekeeping A11Y: agrega flutter_localizations con
# los 3 delegates globales (Material/Widgets/Cupertino) y locale
# forzado a es_MX. Cierra deuda arrastrada de 3 sprints (drilldown,
# calendar, heatmap). Los tooltips/semantics del TableCalendar,
# IconButtons y dialogs default ahora aparecen en español.
# 0.16.3+85 — pulido UX del heatmap: (a) ícono open_in_full sutil al
# lado del nombre del mes en cada _MonthMini como affordance de que
# el mini se puede tapear/expandir (hint de descubribilidad del
# sheet); (b) en año vacío se oculta la leyenda de gradientes para
# evitar redundancia con el empty banner "Sin gastos registrados".
# 0.16.4+86 — sprint flutter-reports-income-heatmap-v1: 11º tab
# "Heatmap ingresos" simétrico al de gastos pero con kind='income'
# y paleta verde (positive). Nuevo modelo IncomeHeatmap + método
# ReportsService.incomeHeatmap({year}) + widget IncomeHeatmapTab
# con mismo layout 3×4 mini-heatmaps + bottom sheet expandido. Reusa
# heatmapDayForMonthPosition del spending. Sin schema bump, sin dep
# externa. +21 tests.
# 0.21.0+97 — sprint flutter-design-tokens-v1 (Sprint 1 del roadmap
# de la auditoría de diseño 2026-07-14). Introduce sistema de tokens
# explícito: 4 archivos nuevos en lib/theme/ (typography 7 tokens,
# spacing 7 + 4 semánticos derivados, radii 5, motion 5 durations +
# 4 curves) + fincore_colors.dart extendido con 4 alphas semánticos
# (hover, hairline, tint, selected). textTheme cableado con fontSize
# explícito por los 15 slots M3 mapeados a los 7 tokens. Migración
# de los 24 widgets compartidos de lib/widgets/ a consumir tokens.
# Documentación en CLAUDE.md con reglas vinculantes. Cero cambios
# visuales percibidos (refactor puro). 680 tests verdes.
# 0.21.1+98 — sprint flutter-language-cleanup-v1 (Sprint 2 del roadmap
# de la auditoría de diseño 2026-07-14). Purga total del voseo
# rioplatense: 10 sitios de copy visible al usuario migrados a español
# neutral (tú directo o infinitivo impersonal), 15 comentarios "acá" →
# "aquí" en lib/ y test/, 1 mención de "kinds" en Settings → "tipos
# de movimientos". Test guardrail nuevo en test/language/no_voseo_test.dart
# que bloquea regresión en CI. 5 matchers de integration_test
# actualizados al copy neutral actual (estaban apuntando a strings
# ya inexistentes en lib/). Convención documentada en CLAUDE.md.
# 0.22.0+99 — sprint flutter-entry-form-redesign-v1 (Sprint 3 del
# roadmap de la auditoría de diseño 2026-07-14). Rediseño del flujo
# más frecuente (registro de movimientos): amount input como hero
# (36sp con formato de miles en vivo + color por kind + autofoco),
# quick-chips de fecha (Hoy/Ayer/Anteayer/Otro), botón Guardar en
# AppBar, KindPicker en grid 2×3 compacto, CategoryPicker como
# bottom sheet con search-first + MRU en memoria + agrupación por
# appliesTo, chip prominente "Cambiar tipo" con confirm dialog.
# Nuevo widget AmountInputFormatter con 26 tests unitarios; API
# preservada de KindPicker y CategoryPicker (weekly_budgets sigue
# funcionando sin cambios). Copy Cancelar → Eliminar (voz + neutral).
# 707 tests verdes.
# 0.23.0+100 — sprint flutter-dashboard-clarity-v1 (Sprint 4). Invierte
# jerarquía de KPIs BO/DE/CR: label descriptivo arriba (BOLSA + DÉBITO,
# DEUDA, DISPONIBLE), monto grande con color emocional, código sólo en
# Semantics.label. Icono de credit type migra de warning (amarillo) a
# textMuted (regla CLAUDE.md: warning es para alertas operativas, no
# tipos de cuenta). First-run reescrito con Empezar desde cero
# recomendado (border 2px accent + badge), copy sin jerga (BD/singleton).
# 0.24.0+101 — sprint flutter-reports-shared-widgets-v1 (Sprint 5,
# scope acotado). Extrae DeltaChip + helpers (deltaColor, formatDelta)
# de cashflow_tab.dart a mobile/lib/widgets/delta_chip.dart para
# reutilizar en drill-downs y otros reports. Crea FincoreEmptyState
# genérico (icon + title + body + cta) en mobile/lib/widgets/
# fincore_empty_state.dart, base para reemplazar Text centrados
# textMuted en próximos sprints. Sin cambio arquitectural (tabs de
# reports permanecen; hub visual queda para sprint futuro).
version: 0.24.0+101

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # Localizations globales (GlobalMaterialLocalizations, etc.). Sin
  # esto los tooltips/semantics de widgets Material (chevrons del
  # TableCalendar, botones de IconButton, dialogs default, etc.)
  # aparecen en inglés — inconsistente con el resto de la app que
  # está en español neutro. Sprint A11Y de housekeeping.
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # SQLite con drift + codegen. Streams reactivos cacheados.
  # Pinned a versión exacta (RF-018): cualquier minor bump rompe queries,
  # binding nativo o codegen. Bumpear con changelog en mano.
  drift: 2.31.0
  drift_flutter: 0.2.8
  sqlite3: 2.9.4
  sqlite3_flutter_libs: 0.5.42
  path: ^1.9.0
  path_provider: ^2.1.0

  # Formato de moneda y fechas en es_MX.
  intl: ^0.19.0

  # Navegación declarativa con redirect a /first-run si BD vacía.
  # Pinned a versión exacta (RF-018): cualquier minor bump rompe redirects.
  go_router: 14.8.1

  # Importar backup JSON desde file picker del sistema.
  file_picker: ^8.1.0

  # Exportar backup vía share sheet de Android.
  share_plus: ^10.0.0

  # File picker para Linux desktop (fallback de file_picker).
  file_selector: ^1.0.0

  # Lectura de versionName + versionCode en runtime (Settings "Acerca de").
  package_info_plus: ^8.0.0

  # M1 del quality review v2 (2026-06-19): `characters` viene transitiva del
  # Flutter SDK, pero `lib/data/backup.dart` la importa directamente para
  # truncados grapheme-safe. Declararla acá evita el warning del lint
  # `depend_on_referenced_packages` y blinda contra cambios futuros en el SDK.
  characters: ^1.4.0

  # Widget de calendario mensual con markers por día (sprint
  # `flutter-reports-movements-calendar-v1`). Pinned a versión exacta
  # (RF-018): cualquier minor bump podría romper el API de builders o
  # el rendering de headers en español. Bumpear con changelog en mano.
  table_calendar: 3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Integration tests: runtime real en device/emulator, sin pumpAndSettle
  # frágil. Diagnóstico R2 del quality review v1 confirmó que el harness
  # `pumpFincoreApp` cuelga `watchPage` con filtros de categoryIds — los
  # integration tests evitan ese path corriendo en runtime real.
  integration_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Mocks de file_picker y share_plus en widget tests.
  mocktail: ^1.0.4

  # Codegen drift. Pinned para matchear `drift: 2.31.0` runtime.
  drift_dev: 2.31.0
  build_runner: ^2.4.0

  # Generación de iconos de launcher (Android adaptive + monochrome themed).
  flutter_launcher_icons: ^0.14.1

  # Generación del splash nativo Android (pantalla del sistema antes de que
  # Flutter pinte el primer frame). Corre con
  # `dart run flutter_native_splash:create` desde mobile/.
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# Config de flutter_launcher_icons: corre con
# `flutter pub run flutter_launcher_icons` desde mobile/.
flutter_launcher_icons:
  image_path: "assets/icon/icon_full.png"

  android: true
  adaptive_icon_background: "#1F242B"
  adaptive_icon_foreground: "assets/icon/foreground_1024.png"
  adaptive_icon_monochrome: "assets/icon/monochrome_1024.png"
  min_sdk_android: 24

# Config de flutter_native_splash. Símbolo centrado sobre fondo canvas
# (mismo color del SplashScreen widget Flutter — transición invisible).
# Web/iOS deshabilitados: solo Android es target del MVP.
flutter_native_splash:
  color: "#1F242B"
  color_dark: "#1F242B"
  image: "assets/icon/foreground_1024.png"
  image_dark: "assets/icon/foreground_1024.png"
  android: true
  ios: false
  web: false
  # Android 12+ usa el SplashScreen API nativo. `icon_background_color`
