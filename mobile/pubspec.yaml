name: fincore
description: "FinCore — app local-first single-user de finanzas personales. SQLite vía drift, sin red, sin login."
publish_to: 'none'

# 0.2.0+5: pickers migrados a DropdownMenu (M3) para que el overlay
# respete el ancho del field y no se desborde.
# 0.4.0+43: sprint flutter-reports-v1 — pantalla /reports + primer reporte
# "Gasto por categoría" con rango libre y bar chart horizontal nativo.
# 0.4.1+44: chips de presets (Este mes / Mes pasado / Año / Custom) en el
# header de /reports en lugar de los pills outlined; default = mes calendario
# completo. Refinamiento UX post-smoke con Diego.
# 0.4.2+45: correcciones del quality review v1 — manejo de snap.hasError,
# loading state estático con texto, helper extraído reportRangeForPreset
# + tests de cruce enero/diciembre, desviaciones-6 y -7 documentadas.
# 0.4.3+46: chipTheme global con selectedColor + surfaceTintColor del accent
# (en vez del secondary verde del colorScheme). Post-smoke con Diego.
# 0.5.0+47: sprint flutter-movements-filters-v1 — panel full-screen de filtros
# de movimientos con 4 dimensiones (fecha presets, tipo combinado "Gastos",
# cuenta single, categorías multi-select), chips de filtros activos con X
# arriba de la lista, deep link desde el reporte (tap en bucket pre-carga
# filtros equivalentes). Multi-kind + multi-categoría + token "Sin categoría"
# en el DAO. Default cambia de "sin filtro" a "Este mes" calendario.
# 0.5.1+48: perf v1 — eliminar SkeletonCard animado del load state de
# /entries y migrar _ActiveFiltersBar + EntriesFiltersScreen a listas
# resueltas (sin StreamBuilders anidados). Reduce re-renders en el cel real.
# 0.5.2+49: chip color fix v2 — override `secondaryContainer` del
# colorScheme al accent. El ripple/state de los ChoiceChip ya no deriva
# del positive verde sino del accent azul cyan.
# 0.5.3+50: filtros multi-select reales — el preset "Gastos" combinado se
# eliminó por feedback de Diego. Tipo ahora muestra los 5 kinds individuales
# (incluido "Gasto a tarjeta") con multi-select. Cuenta también pasa a
# multi-select. DAO acepta accountIds: List<String>?.
# 0.5.4+51: correcciones del quality review v1 — kUncategorizedFilterToken
# movido a lib/constants/filter_tokens.dart, FilterDimension público con
# extension clearDimension, EntriesFilters.forCategoryBucket + toDeepLink
# encapsulan el deep link del reporte, copyWith con List.unmodifiable,
# mutaciones de _filters dentro de setState, chip de cuenta/categoría
# archivada con "(archivada)", tap target del X expandido a 32x32 con
# splash 22, indicador "mostrando 200 más recientes" cuando se alcanza
# el limit, botón "Limpiar filtros" en estado vacío con filtros activos.
# +2 tests del transfer single-account (M14). 215/215 verdes.
# 0.6.0+52: sprint flutter-movements-pagination-v1 — scroll infinito en
# /entries con _currentLimit creciente (default 100, +100 por carga
# automática a 300px del final), footer "Cargando…" / "Fin de los
# movimientos del rango", reset al cambiar filtros. Eliminados
# kind/accountId deprecados del DAO. Eliminado _TruncatedFooter viejo.
# +3 tests data del DAO (offset/limit). 217/217 verdes.
# 0.6.1+53: patch riesgos del sprint paginación. (1) Tope `_kMaxLimit=2000`
# en `_currentLimit` con footer especializado pidiendo acotar filtros.
# (2) Cobertura del scroll infinito con integration_test (3 tests verdes
# en runtime real) tras descubrir que el cuelgue de pumpAndSettle con
# `categoryIds` en query params es por interacción de drift +
# AppDependencies completo en el harness — diagnóstico documentado.
# 0.6.2+54: pinear deps críticas a versión exacta (RF-018). drift, drift_dev,
# drift_flutter, go_router, sqlite3, sqlite3_flutter_libs ya no flotan con
# `^`. Mantenimiento previo al ciclo de sprints de deuda técnica para que
# baseline sea reproducible.
# 0.6.3+55: sprint flutter-integration-tests-v1 — migración de widget tests
# diferidos al package integration_test. +14 tests verdes en runtime real
# (account_form 5, category_form 5, entries_filters_panel 2,
# settings_destructive 2) cubriendo el DV-2/RF-020-023 del v4 + M10 del
# MVP. Sin cambios productivos. 217/217 unit + 17 integration verdes.
# 0.6.4+56: sprint flutter-entries-list-refactor-v1 — partir el monolito
# de `EntriesListScreen` (672 líneas) en 4 archivos con responsabilidades
# claras: screen (170, solo shell + filtros), entries_paginated_list (340,
# stream + scroll + paginación), entries_active_filters_bar (155, bar +
# chips), entries_empty_state (50). El state de paginación se mueve al
# widget hijo; el padre solo le pasa `filters` y el hijo detecta cambios
# con didUpdateWidget. Cero cambios de comportamiento. 217 unit + 17
# integration verdes (sin regresión).
version: 0.6.4+56

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # SQLite con drift + codegen. Streams reactivos cacheados.
  # Pinned a versión exacta (RF-018): cualquier minor bump rompe queries,
  # binding nativo o codegen. Bumpear con changelog en mano.
  drift: 2.31.0
  drift_flutter: 0.2.8
  sqlite3: 2.9.4
  sqlite3_flutter_libs: 0.5.42
  path: ^1.9.0
  path_provider: ^2.1.0

  # Formato de moneda y fechas en es_MX.
  intl: ^0.19.0

  # Navegación declarativa con redirect a /first-run si BD vacía.
  # Pinned a versión exacta (RF-018): cualquier minor bump rompe redirects.
  go_router: 14.8.1

  # Importar backup JSON desde file picker del sistema.
  file_picker: ^8.1.0

  # Exportar backup vía share sheet de Android.
  share_plus: ^10.0.0

  # File picker para Linux desktop (fallback de file_picker).
  file_selector: ^1.0.0

  # Lectura de versionName + versionCode en runtime (Settings "Acerca de").
  package_info_plus: ^8.0.0

  # M1 del quality review v2 (2026-06-19): `characters` viene transitiva del
  # Flutter SDK, pero `lib/data/backup.dart` la importa directamente para
  # truncados grapheme-safe. Declararla acá evita el warning del lint
  # `depend_on_referenced_packages` y blinda contra cambios futuros en el SDK.
  characters: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Integration tests: runtime real en device/emulator, sin pumpAndSettle
  # frágil. Diagnóstico R2 del quality review v1 confirmó que el harness
  # `pumpFincoreApp` cuelga `watchPage` con filtros de categoryIds — los
  # integration tests evitan ese path corriendo en runtime real.
  integration_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Mocks de file_picker y share_plus en widget tests.
  mocktail: ^1.0.4

  # Codegen drift. Pinned para matchear `drift: 2.31.0` runtime.
  drift_dev: 2.31.0
  build_runner: ^2.4.0

  # Generación de iconos de launcher (Android adaptive + monochrome themed).
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# Config de flutter_launcher_icons: corre con
# `flutter pub run flutter_launcher_icons` desde mobile/.
flutter_launcher_icons:
  image_path: "assets/icon/icon_full.png"

  android: true
  adaptive_icon_background: "#1F242B"
  adaptive_icon_foreground: "assets/icon/foreground_1024.png"
  adaptive_icon_monochrome: "assets/icon/monochrome_1024.png"
  min_sdk_android: 24
