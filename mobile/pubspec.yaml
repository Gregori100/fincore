# 0.15.0+77 — sprint flutter-reports-income-by-category-v1. Octavo tab
# "Ingreso por categoría" en /reports, análogo al de gastos pero para
# kind='income'. LEFT JOIN con applies_to != 'expense' (en el JOIN, no
# en el WHERE) agrupa 3 casos de "Sin categoría": null + archivada +
# expense legacy. Drill-down por bucket con nuevo factory
# EntriesFilters.forIncomeBucket. Sin schema bump. +15 tests nuevos.
# 0.15.1+78 — sprint flutter-reports-drilldown-parity-v1. Cierra la
# brecha reporte↔drill-down para el bucket "Sin categoría": (a) filtro
# simétrico `applies_to != 'income'` en el JOIN de spendingByCategory;
# (b) EntriesDao.watchPage amplía la definición del token cuando el
# filtro `kinds` está restringido a un único tipo de flujo. Sin schema
