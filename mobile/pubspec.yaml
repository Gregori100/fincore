  # halo blanco/gris en cels con esa versión.
  android_12:
    image: "assets/icon/foreground_1024.png"
    image_dark: "assets/icon/foreground_1024.png"
    color: "#1F242B"
    color_dark: "#1F242B"
    icon_background_color: "#1F242B"
    icon_background_color_dark: "#1F242B"
