# 0.14.4+76 — rediseño de los diálogos de confirmación destructiva
# (archivar cuenta + archivar categoría). Nuevo widget
# `DestructiveDialog` con ícono destacado en círculo negativo, chips
# visuales de "impacto" (movimientos afectados, saldos ajustados),
# banner de advertencia amarillo y botones balanceados. Sin cambios
