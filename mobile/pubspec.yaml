name: fincore
description: "FinCore — app local-first single-user de finanzas personales. SQLite vía drift, sin red, sin login."
publish_to: 'none'

# 0.2.0+5: pickers migrados a DropdownMenu (M3) para que el overlay
# respete el ancho del field y no se desborde.
# 0.4.0+43: sprint flutter-reports-v1 — pantalla /reports + primer reporte
# "Gasto por categoría" con rango libre y bar chart horizontal nativo.
# 0.4.1+44: chips de presets (Este mes / Mes pasado / Año / Custom) en el
# header de /reports en lugar de los pills outlined; default = mes calendario
# completo. Refinamiento UX post-smoke con Diego.
# 0.4.2+45: correcciones del quality review v1 — manejo de snap.hasError,
# loading state estático con texto, helper extraído reportRangeForPreset
# + tests de cruce enero/diciembre, desviaciones-6 y -7 documentadas.
# 0.4.3+46: chipTheme global con selectedColor + surfaceTintColor del accent
# (en vez del secondary verde del colorScheme). Post-smoke con Diego.
# 0.5.0+47: sprint flutter-movements-filters-v1 — panel full-screen de filtros
# de movimientos con 4 dimensiones (fecha presets, tipo combinado "Gastos",
# cuenta single, categorías multi-select), chips de filtros activos con X
# arriba de la lista, deep link desde el reporte (tap en bucket pre-carga
# filtros equivalentes). Multi-kind + multi-categoría + token "Sin categoría"
# en el DAO. Default cambia de "sin filtro" a "Este mes" calendario.
# 0.5.1+48: perf v1 — eliminar SkeletonCard animado del load state de
# /entries y migrar _ActiveFiltersBar + EntriesFiltersScreen a listas
# resueltas (sin StreamBuilders anidados). Reduce re-renders en el cel real.
# 0.5.2+49: chip color fix v2 — override `secondaryContainer` del
# colorScheme al accent. El ripple/state de los ChoiceChip ya no deriva
# del positive verde sino del accent azul cyan.
# 0.5.3+50: filtros multi-select reales — el preset "Gastos" combinado se
# eliminó por feedback de Diego. Tipo ahora muestra los 5 kinds individuales
# (incluido "Gasto a tarjeta") con multi-select. Cuenta también pasa a
# multi-select. DAO acepta accountIds: List<String>?.
# 0.5.4+51: correcciones del quality review v1 — kUncategorizedFilterToken
# movido a lib/constants/filter_tokens.dart, FilterDimension público con
# extension clearDimension, EntriesFilters.forCategoryBucket + toDeepLink
# encapsulan el deep link del reporte, copyWith con List.unmodifiable,
# mutaciones de _filters dentro de setState, chip de cuenta/categoría
# archivada con "(archivada)", tap target del X expandido a 32x32 con
# splash 22, indicador "mostrando 200 más recientes" cuando se alcanza
# el limit, botón "Limpiar filtros" en estado vacío con filtros activos.
# +2 tests del transfer single-account (M14). 215/215 verdes.
# 0.6.0+52: sprint flutter-movements-pagination-v1 — scroll infinito en
# /entries con _currentLimit creciente (default 100, +100 por carga
# automática a 300px del final), footer "Cargando…" / "Fin de los
# movimientos del rango", reset al cambiar filtros. Eliminados
# kind/accountId deprecados del DAO. Eliminado _TruncatedFooter viejo.
# +3 tests data del DAO (offset/limit). 217/217 verdes.
# 0.6.1+53: patch riesgos del sprint paginación. (1) Tope `_kMaxLimit=2000`
# en `_currentLimit` con footer especializado pidiendo acotar filtros.
# (2) Cobertura del scroll infinito con integration_test (3 tests verdes
# en runtime real) tras descubrir que el cuelgue de pumpAndSettle con
# `categoryIds` en query params es por interacción de drift +
# AppDependencies completo en el harness — diagnóstico documentado.
# 0.6.2+54: pinear deps críticas a versión exacta (RF-018). drift, drift_dev,
# drift_flutter, go_router, sqlite3, sqlite3_flutter_libs ya no flotan con
# `^`. Mantenimiento previo al ciclo de sprints de deuda técnica para que
# baseline sea reproducible.
# 0.6.3+55: sprint flutter-integration-tests-v1 — migración de widget tests
# diferidos al package integration_test. +14 tests verdes en runtime real
# (account_form 5, category_form 5, entries_filters_panel 2,
# settings_destructive 2) cubriendo el DV-2/RF-020-023 del v4 + M10 del
# MVP. Sin cambios productivos. 217/217 unit + 17 integration verdes.
# 0.6.4+56: sprint flutter-entries-list-refactor-v1 — partir el monolito
# de `EntriesListScreen` (672 líneas) en 4 archivos con responsabilidades
# claras: screen (170, solo shell + filtros), entries_paginated_list (340,
# stream + scroll + paginación), entries_active_filters_bar (155, bar +
# chips), entries_empty_state (50). El state de paginación se mueve al
# widget hijo; el padre solo le pasa `filters` y el hijo detecta cambios
# con didUpdateWidget. Cero cambios de comportamiento. 217 unit + 17
# integration verdes (sin regresión).
# 0.6.5+57: sprint flutter-pumpandsettle-diagnosis-v1 — el cuelgue
# sistémico de `pumpAndSettle` con `pumpFincoreApp` + filtros drift
# fue resuelto como efecto colateral del refactor del 0.6.4. Causa
# raíz: cuando `_stream`, `_accountsSub`, `_categoriesSub` coexistían
# en el mismo State, el primer setState de los subs invalidaba el
# frame antes de que el StreamBuilder de `_stream` recibiera su primer
# evento — loop de rebuild que pumpAndSettle no podía aterrizar. M3
# (deep link via URL manual) y M10 (multi-select del panel con datos
# sembrados) reactivados como widget tests en sus archivos originales.
# 219 unit + 17 integration verdes. Sin cambios productivos.
# 0.7.0+58: sprint flutter-reports-cashflow-v1 — agregar tab "Cashflow
# mensual" al `/reports` (segundo tab además de "Gasto por categoría").
# Bar chart pareado nativo (verde ingresos / rojo gastos) por mes
# calendario + 3 métricas del período (ingresos, gastos, neto) +
# breakdown numérico. Default `thisMonth` por coherencia con el otro
# tab. Excluye transfer y debt_payment (RN-C03 — movimientos internos
# sin impacto en flujo "contra el afuera"). +13 tests data + 3 widget
# tests. 235/235 verdes. Sin cambios productivos breaking ni schema.
# 0.7.1+59: sprint flutter-movements-amount-filter-v1 — agregar
# dimensión "Monto" al panel de filtros de `/entries`. 2 fields
# numéricos opcionales (mínimo y máximo). DAO extiende `watchPage`
# con `minAmount`/`maxAmount` opcionales que agregan `amount >= min`
# y `amount <= max` (RN-A02/A03 — inclusivos). Chip en la
# `EntriesActiveFiltersBar` con label condicional (`≥ $X`, `≤ $X`,
# `$X – $Y`). Validación `min > max` con snackbar warning. +6 tests
# data + 7 modelo + 3 widget = 16 nuevos. 251/251 verdes. Sin schema.
# 0.8.0+60: sprint flutter-reports-top-movements-v1 — tercer tab
# "Top movimientos" en `/reports` (junto a "Gasto por categoría" y
# "Cashflow mensual"). Lista los hasta N=20 movimientos más grandes
# del rango ordenados por monto desc. Chips de kinds multi-select
# en el header (default los 5 seleccionados; sin selección = empty
# state forzado). Tap en row navega a `/entries/:id/edit`. TabBar
# pasa de 2 a 3 tabs con `isScrollable: true` para que no se
# encimen los labels. +11 tests data + 4 widget tests. 266/266
# verdes. Sin schema bump.
# 0.9.0+61: sprint flutter-reports-balance-at-date-v1 — cuarto tab
# "Saldo a fecha" en `/reports`. Replay del journal hasta fin del
# día de `asOf` para calcular BO/DE/CR + lista de cuentas con saldo
# individual. Útil para reconciliar contra estados de cuenta del
# banco a fecha de corte. Date picker single con `lastDate = hoy`.
# Default `_asOf = fin del mes anterior` (decisión P-001). 1 query
# SQL agregada que sirve totales y desglose (más eficiente que 4
# queries separadas). +8 tests data + 3 widget tests. 277/277
# verdes. Sin schema bump.
# 0.10.0+62: sprint flutter-entries-saved-views-v1 — vistas guardadas
# del panel de filtros de `/entries`. CRUD completo: guardar (botón
# en panel), aplicar/renombrar/eliminar (sheet desde AppBar con icono
# bookmark). **Primer schema bump del MVP local** (2 → 3): tabla
# `saved_views` nueva con migración aditiva en `onUpgrade`.
# Serializador híbrido en `EntriesFilters`: preset semántico (thisMonth,
# etc) se guarda como slug rolling; custom guarda from/to ISO8601
# fijos. wipeAll() extendido para borrar también las vistas. +10
# tests DAO + 6 serializer + 1 migración + 3 widget = 20 nuevos.
# 299/299 verdes.
# 0.12.0+68 — sprint flutter-onboarding-for-testers-v1: prepara la app
# para beta testers. (1) Onboarding de 3 slides previo al first-run, (2)
# sección Ayuda en Settings con FAQ corto, (3) indicador de último
# respaldo con badge si pasaron ≥14 días. Schema bump v3→v4 con tabla
# `app_preferences` aditiva. Sin disrupción para usuarios existentes
# (Diego con Bolsa nunca ve onboarding). +5 unit DAO + 3 migración + 6
# onboarding + 4 help + 5 settings = 23 nuevos. 367/367 verdes.
# 0.12.1+69 — splash nativo Android con símbolo centrado sobre canvas
# (#1F242B). Genera drawables vía `flutter_native_splash` (light + dark
# + Android 12+ SplashScreen API). Elimina el flash blanco/negro antes
# de que Flutter pinte el primer frame — transición invisible hacia el
# SplashScreen widget que ya tenía el wordmark.
# 0.12.2+70 — animación de entrada del slide 1 del onboarding. Símbolo
# (scale + fade con overshoot), wordmark (slide up + fade) y párrafo
# (fade) en 3 etapas solapadas de ~900ms total. Solo afecta a testers
# nuevos (Diego con Bolsa no ve onboarding); también se reproduce al
# entrar desde Ayuda → "Ver tour de bienvenida".
# 0.13.0+71 — sprint flutter-reports-credit-cards-v1. (1) Sexto tab
# "Tarjetas" en /reports con estado por tarjeta (deuda, %, disponible,
# próximo corte/pago, pago mínimo estimado). (2) Inputs UI para
# `minimumPaymentPct` e `interestRate` en AccountFormScreen — controllers
# huérfanos desde el pivote conectados a TextFields. (3) Schema bump
# v4→v5: `credit_limit` NOT NULL DEFAULT 0 con migración aditiva +
# ramas defensivas 3→5, 2→5, 1→5. Backup import v1 legacy con
# credit_limit=null ajusta a 0 con contador en ImportReport. +39 tests
# nuevos (15 date helpers, 5 DAO, 10 servicio watchCreditCards, 4 backup
# compat, 5 widget). 406/406 verdes.
# 0.14.0+72 — sprint flutter-budgets-v1. Séptimo tab "Presupuestos" en
# /reports con progreso del mes por categoría (gastado vs monthly_limit,
# ring de %, estados OK/Warning/Excedido/Sin gasto). Input UI
# "Presupuesto mensual" conectado en CategoryFormScreen (visible solo
# cuando applies_to != income). Validaciones DAO nuevas
# (invalid_monthly_limit + invalid_monthly_limit_for_income). Sin schema
# bump — la columna `categories.monthly_limit` existía desde el legacy.
# Slide 3 del onboarding a "7 reportes" con scroll interno; FAQ Ayuda
# actualizado + tile nuevo "¿Cómo defino un presupuesto?". +19 tests
# nuevos. 431/431 verdes.
# 0.14.1+73 — neutralización del español. Se remueve el voseo argentino
# ("tenés", "seteás", "andá", "querés") y vocabulario local ("plata",
# "cel", "acá") de todos los textos visibles al usuario. Registro neutro
# impersonal (infinitivos: "Registrar movimiento", "Verificar las fechas")
# + vocabulario neutral latino (dinero, celular, aquí). Sin cambios de
# comportamiento ni schema. 435/435 verdes.
# 0.14.2+74 — selector de mes en la pestaña Presupuestos. Chevrons <
# ›  + tap en el nombre del mes abre un date picker. Badge "Hoy" cuando
# es el mes en curso; aviso "El límite mostrado es el actual" cuando
# es un mes histórico (el schema no guarda snapshots del monthly_limit).
# Sin cambios de schema. 437/437 verdes.
# 0.14.3+75 — diálogo de archivar categoría ahora cuenta cuántos
# movimientos usan esa categoría y advierte que quedarán huérfanos.
# Nuevo helper `CategoriesDao.countAssociatedEntries` simétrico al de
